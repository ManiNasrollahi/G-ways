<ui:composition template="/panel/control-plane.xhtml" xmlns:h="jakarta.faces.html" xmlns:p="primefaces" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
  <ui:define name="content">
  <p:growl id="messages" showDetail="true" life="5000" />
  <h:form id="blacklistListForm">
    <main class="page-shell">
      <header class="page-header">
        <div>
          <span class="eyebrow">CONTROL PLANE</span>
          <h1>Gateway Blacklist</h1>
          <p>Block client IP addresses from accessing the gateway</p>
        </div>
        <div class="page-header-actions"><p:commandButton value="How to use" icon="pi pi-question-circle" type="button" styleClass="help-button" onclick="PF('pageHelpDialog').show()" /><p:commandButton value="New Blacklist Entry" icon="pi pi-plus" process="@this" actionListener="#{gatewayBlacklistView.openNew}" update=":blacklistDialogForm" oncomplete="PF('blacklistDialog').show()" /></div>
      </header>
      <section class="stat-grid">
        <article class="stat-card">
          <strong>#{gatewayBlacklistView.entries.size()}</strong>
          <span>Total Entries</span>
        </article>
        <article class="stat-card">
          <strong>#{gatewayBlacklistView.enabledCount}</strong>
          <span>Active Blocks</span>
        </article>
      </section>
      <section class="content-card">
        <p:dataTable id="blacklistTable" value="#{gatewayBlacklistView.entries}" var="item"
                     paginator="true" rows="10" paginatorPosition="bottom" emptyMessage="No blacklist entries have been registered" styleClass="route-table">

          <p:column headerText="IP Address">
            <span class="destination">
              <h:outputText value="#{item.ip}" />
            </span>
          </p:column>
          <p:column headerText="Description">
            <h:outputText value="#{item.description}" />
          </p:column>
          <p:column headerText="Status">
            <span class="status-pill #{item.enabled ? 'is-active' : 'is-disabled'}">
              <i class="pi #{item.enabled ? 'pi-ban' : 'pi-pause-circle'}" />
              <h:outputText value="#{item.enabled ? 'Blocked' : 'Disabled'}" />
            </span>
          </p:column>
          <p:column headerText="Registered By" styleClass="audit-user-column">
            <h:outputText value="#{item.registerUser}" />
          </p:column>
          <p:column headerText="Created At" styleClass="audit-date-column">
            <h:outputText value="#{gatewayBlacklistView.formatAuditDate(item.createdAt)}" />
          </p:column>
          <p:column headerText="Updated At" styleClass="audit-date-column">
            <h:outputText value="#{gatewayBlacklistView.formatAuditDate(item.updatedAt)}" />
          </p:column>
          <p:column headerText="Actions" styleClass="actions-column">
            <p:commandButton icon="pi pi-pencil" title="Edit" styleClass="ui-button-flat ui-button-secondary" process="@this" actionListener="#{gatewayBlacklistView.openEdit(item.id)}" update=":blacklistDialogForm" oncomplete="PF('blacklistDialog').show()" />
            <p:commandButton icon="pi pi-trash" title="Delete" styleClass="ui-button-flat ui-button-danger" actionListener="#{gatewayBlacklistView.delete(item)}" update="blacklistListForm messages">
              <p:confirm header="Delete Blacklist Entry" message="Are you sure you want to delete this blacklist entry?" icon="pi pi-exclamation-triangle" />
            </p:commandButton>
          </p:column>
        </p:dataTable>
      </section>
    </main>
    <p:confirmDialog global="true" responsive="true">
      <p:commandButton value="Delete" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
      <p:commandButton value="Cancel" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" />
    </p:confirmDialog>
  </h:form>
  <p:dialog widgetVar="blacklistDialog" header="Blacklist Entry Configuration" modal="true" responsive="true" width="620" closeOnEscape="true" styleClass="route-dialog">
    <h:form id="blacklistDialogForm">
      <p:messages id="dialogMessages" showDetail="true" closable="true" />
      <div class="form-grid">
        <div class="field field-wide">
          <p:outputLabel for="ip" value="IP Address" />
          <p:inputText id="ip" value="#{gatewayBlacklistView.entry.ip}" required="true" requiredMessage="IP address is required" placeholder="192.168.1.10" />
        </div>
        <div class="field field-wide">
          <p:outputLabel for="description" value="Description" />
          <p:inputTextarea id="description" value="#{gatewayBlacklistView.entry.description}" maxlength="500" autoResize="false" placeholder="Reason for blocking this address" />
        </div>
        <div class="field toggle-field">
          <p:outputLabel for="enabled" value="Entry Status" />
          <p:toggleSwitch id="enabled" value="#{gatewayBlacklistView.entry.enabled}" />
          <span>Enable block</span>
        </div>
      </div>
      <div class="dialog-actions">
        <p:commandButton value="Cancel" type="button" styleClass="ui-button-secondary ui-button-outlined" onclick="PF('blacklistDialog').hide()" />
        <p:commandButton value="Save" icon="pi pi-check" actionListener="#{gatewayBlacklistView.save}" oncomplete="if (!args.validationFailed) PF('blacklistDialog').hide()" process="@form" update="@form :blacklistListForm messages" />
      </div>
    </h:form>
  </p:dialog>
    <ui:include src="/panel/includes/page-help.xhtml"><ui:param name="helpKey" value="blacklist" /></ui:include>
  </ui:define>
</ui:composition>
