<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>403 | Access denied</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7fb; color: #243247; font-family: system-ui, sans-serif; }
main { width: 100%; max-width: 580px; padding: clamp(24px, 6vw, 56px); background: white; border: 1px solid #dce4ee; border-radius: 20px; box-shadow: 0 16px 48px #2432470d; }
.brand { color: #52647d; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.code { margin: 28px 0 8px; color: #2563eb; font-size: clamp(64px, 15vw, 104px); font-weight: 750; line-height: 1; }
h1 { font-size: clamp(24px, 5vw, 32px); margin: 20px 0 12px; }
p { line-height: 1.7; color: #52647d; }
.hint { margin-top: 32px; padding-top: 20px; border-top: 1px solid #e5eaf1; font-size: 14px; }
</style>
</head>
<body><main aria-labelledby="title">
<div class="brand">Gateway</div><div class="code">403</div>
<h1 id="title">Access denied</h1><p>You do not have permission to access this resource.</p>
<p class="hint">If the problem continues, contact your administrator.</p>
</main></body></html>
